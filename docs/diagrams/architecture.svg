<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="900" viewBox="0 0 1560 900" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif"><defs><marker id="ah-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#2f9e6e"/></marker><marker id="ah-pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#e05561"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#4285f4"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#8b5cf6"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#e0a13a"/></marker><marker id="ah-cyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#2aa5b0"/></marker><marker id="ah-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#8494ab"/></marker><marker id="ah-white" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#c9d3e2"/></marker><filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1b2a4a" flood-opacity="0.10"/></filter></defs><rect width="1560" height="900" fill="#fbfcfe"/><text x="780.0" y="52" text-anchor="middle" font-size="27" font-weight="700" fill="#16203a">ChaosMeshLite - resilience gate</text><text x="780.0" y="80" text-anchor="middle" font-size="14.5" fill="#6b7794">Inject deterministic faults into a stream of observed calls, measure success rate and p95, then pass or fail the SLO.</text><rect x="50" y="175" width="300" height="232" rx="18" fill="#ffffff" fill-opacity="0.55" stroke="#8494ab" stroke-width="1.5" stroke-dasharray="7 5" stroke-opacity="0.75"/><text x="68" y="166" font-size="13.5" font-weight="700" letter-spacing="0.4" fill="#3d4a63">1 - INPUTS</text><rect x="70" y="207" width="260" height="69" rx="14" fill="#ddf3f5" stroke="#2aa5b0" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(86,222) scale(0.8750)" fill="none" stroke="#2aa5b0" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h2"/><path d="M8 7v10"/><path d="M12 4v16"/><path d="M16 8v8"/><path d="M20 11v2"/></g><text x="116" y="238" font-size="16.5" font-weight="700" fill="#136b74">Observed calls</text><text x="87" y="260.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">latencies in ms, one per line</text><rect x="70" y="291" width="260" height="69" rx="14" fill="#ece5f9" stroke="#8b5cf6" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(86,306) scale(0.8750)" fill="none" stroke="#8b5cf6" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></g><text x="116" y="322" font-size="16.5" font-weight="700" fill="#552fae">Fault policy</text><text x="87" y="344.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">+N ms, fail every Kth call</text><rect x="400" y="210" width="300" height="150" rx="14" fill="#ece5f9" stroke="#8b5cf6" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(416,225) scale(0.8750)" fill="none" stroke="#8b5cf6" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></g><text x="446" y="241" font-size="16.5" font-weight="700" fill="#552fae">Inject faults</text><text x="417" y="263.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">fail every Kth call -&gt;</text><text x="417" y="280.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">it drops its sample</text><text x="417" y="298.6" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">add N ms to the rest</text><text x="417" y="316.4" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">deterministic, no RNG</text><rect x="770" y="210" width="300" height="150" rx="14" fill="#e2ecfd" stroke="#4285f4" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(786,225) scale(0.8750)" fill="none" stroke="#4285f4" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M21 20H3"/></g><text x="816" y="241" font-size="16.5" font-weight="700" fill="#17509f">Measure</text><text x="787" y="263.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">success_rate =</text><text x="787" y="280.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">successes / total</text><text x="787" y="298.6" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">p95 = nearest-rank at 0.95</text><text x="787" y="316.4" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">over surviving samples</text><rect x="1140" y="210" width="300" height="150" rx="14" fill="#fde5e7" stroke="#e05561" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(1156,225) scale(0.8750)" fill="none" stroke="#e05561" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v16"/><path d="M6 8h12"/><path d="M4 18h6l-3-7z"/><path d="M14 18h6l-3-7z"/></g><text x="1186" y="241" font-size="16.5" font-weight="700" fill="#9e2b36">Judge SLO</text><text x="1157" y="263.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">success_rate vs min</text><text x="1157" y="280.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">p95 vs max</text><text x="1157" y="298.6" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">collect breach reasons</text><text x="1157" y="316.4" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">success rate checked first</text><path d="M332,240 L398,272" stroke="#2aa5b0" stroke-width="2.0" fill="none" marker-end="url(#ah-cyan)"/><path d="M332,324 L398,298" stroke="#8b5cf6" stroke-width="2.0" fill="none" marker-end="url(#ah-purple)"/><path d="M702,285 L768,285" stroke="#8b5cf6" stroke-width="2.0" fill="none" marker-end="url(#ah-purple)"/><rect x="704.912" y="273.0" width="60.176" height="24.0" rx="12" fill="#ffffff" stroke="#8b5cf6" stroke-opacity="0.4"/><text x="735.0" y="289.44" text-anchor="middle" font-size="12" font-weight="600" fill="#552fae">stream</text><path d="M1072,285 L1138,285" stroke="#4285f4" stroke-width="2.0" fill="none" marker-end="url(#ah-blue)"/><rect x="1080.024" y="273.0" width="49.952" height="24.0" rx="12" fill="#ffffff" stroke="#4285f4" stroke-opacity="0.4"/><text x="1105.0" y="289.44" text-anchor="middle" font-size="12" font-weight="600" fill="#17509f">stats</text><rect x="50" y="430" width="1440" height="268" rx="18" fill="#ffffff" fill-opacity="0.55" stroke="#8494ab" stroke-width="1.5" stroke-dasharray="7 5" stroke-opacity="0.75"/><text x="68" y="421" font-size="13.5" font-weight="700" letter-spacing="0.4" fill="#3d4a63">2 - THE SLO GATE</text><rect x="680" y="452" width="200" height="82" rx="14" fill="#fdf1d6" stroke="#e0a13a" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(768.0,466) scale(1.0000)" fill="none" stroke="#e0a13a" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v16"/><path d="M6 8h12"/><path d="M4 18h6l-3-7z"/><path d="M14 18h6l-3-7z"/></g><text x="780.0" y="510" text-anchor="middle" font-size="16.5" font-weight="700" fill="#8c5a0d">SLO holds?</text><path d="M1290,360 L1290.0,390.0 Q1290,405 1275.0,405.0 L795.0,405.0 Q780,405 780.0,420.0 L780,450" stroke="#e05561" stroke-width="2.0" fill="none" marker-end="url(#ah-pink)"/><rect x="1001.312" y="393.0" width="67.376" height="24.0" rx="12" fill="#ffffff" stroke="#e05561" stroke-opacity="0.4"/><text x="1035" y="409.44" text-anchor="middle" font-size="12" font-weight="600" fill="#9e2b36">outcome</text><rect x="150" y="560" width="560" height="120" rx="14" fill="#e3f5ec" stroke="#2f9e6e" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(166,575) scale(0.8750)" fill="none" stroke="#2f9e6e" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.6 2.6L16 9.6"/></g><text x="196" y="591" font-size="16.5" font-weight="700" fill="#186547">Pass - build stays green</text><text x="167" y="613.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">success_rate &gt;= min_success</text><text x="167" y="630.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">and p95 &lt;= max_p95</text><text x="167" y="648.6" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">exit 0: SLO held under chaos</text><rect x="830" y="560" width="560" height="120" rx="14" fill="#fde5e7" stroke="#e05561" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(846,575) scale(0.8750)" fill="none" stroke="#e05561" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g><text x="876" y="591" font-size="16.5" font-weight="700" fill="#9e2b36">Fail - build goes red</text><text x="847" y="613.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">any threshold breached</text><text x="847" y="630.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">exit 1: prints each breach</text><text x="847" y="648.6" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">success_rate line before p95</text><path d="M780,536 L780.0,542.0 Q780,548 774.0,548.0 L435.0,548.0 Q430,548 430.0,553.0 L430,558" stroke="#2f9e6e" stroke-width="2.0" fill="none" marker-end="url(#ah-green)"/><rect x="578.512" y="536.0" width="52.976" height="24.0" rx="12" fill="#ffffff" stroke="#2f9e6e" stroke-opacity="0.4"/><text x="605" y="552.44" text-anchor="middle" font-size="12" font-weight="600" fill="#186547">holds</text><path d="M780,536 L780.0,542.0 Q780,548 786.0,548.0 L1105.0,548.0 Q1110,548 1110.0,553.0 L1110,558" stroke="#e05561" stroke-width="2.0" fill="none" marker-end="url(#ah-pink)"/><rect x="913.4" y="536.0" width="63.199999999999996" height="24.0" rx="12" fill="#ffffff" stroke="#e05561" stroke-opacity="0.4"/><text x="945" y="552.44" text-anchor="middle" font-size="12" font-weight="600" fill="#9e2b36">breach</text><rect x="50" y="722" width="720" height="95.19999999999999" rx="11" fill="#eef1f6" stroke="#8494ab" stroke-width="1.4" stroke-opacity="0.8"/><text x="66" y="746" font-size="13.2" font-weight="700" fill="#3d4a63">Deterministic faults, not RNG</text><text x="66" y="768" font-size="12.4" fill="#3d4a63" fill-opacity="0.92">Faults are a fixed schedule - fail every Kth call, add N ms - never random.</text><text x="66" y="786.4" font-size="12.4" fill="#3d4a63" fill-opacity="0.92">Same stream and policy give a bit-identical result, so a red build is a real signal.</text><text x="66" y="804.8" font-size="12.4" fill="#3d4a63" fill-opacity="0.92">Six language ports produce the same numbers; no flaky chaos.</text><rect x="790" y="722" width="720" height="95.19999999999999" rx="11" fill="#e3f5ec" stroke="#2f9e6e" stroke-width="1.4" stroke-opacity="0.8"/><text x="806" y="746" font-size="13.2" font-weight="700" fill="#186547">How the gate decides</text><text x="806" y="768" font-size="12.4" fill="#186547" fill-opacity="0.92">Thresholds are strict: success_rate &lt; min or p95 &gt; max breaches; equal passes.</text><text x="806" y="786.4" font-size="12.4" fill="#186547" fill-opacity="0.92">Nearest-rank p95; p=0 returns the smallest sample, an empty stream returns 0.</text><text x="806" y="804.8" font-size="12.4" fill="#186547" fill-opacity="0.92">A failed call drops its latency sample; when all fail, success_rate and p95 are 0.</text><text x="780.0" y="882" text-anchor="middle" font-size="12" fill="#6b7794">parag-labs/chaos-mesh-lite</text></svg>